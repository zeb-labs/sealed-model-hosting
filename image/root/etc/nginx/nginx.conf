# The front gate: the customer's inference endpoint. HTTPS on port 443.
# The customer's network reaches exactly four paths of the model server, each
# passed on under a FIXED path, so no trick in the request path can reach
# another door (for example /v1/load_lora_adapter, which only the job runner
# may use, from inside the machine). The three model paths want one of the
# customer's API keys; the health check does not.
# This file is the whole configuration; the image build refuses any other.
user nginx;
worker_processes 2;
error_log stderr warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_buffering off;          # answers stream word by word
    proxy_read_timeout 600s;
    # A key line is up to 135 characters; the default bucket (64) is too small and nginx then refuses the whole list.
    map_hash_bucket_size 256;
    # "Authorization: Bearer <key>" -> 1 for the customer's keys (sealbox/gatekeys.py writes the list).
    map $http_authorization $smh_key_ok { default 0; include /run/smh-gate/keys.map; }
    server {
        listen 443 ssl;
        ssl_certificate     /run/smh-gate/gate.crt;
        ssl_certificate_key /run/smh-gate/gate.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /v1/chat/completions { if ($smh_key_ok = 0) { return 401; } proxy_pass http://127.0.0.1:8000/v1/chat/completions; }
        location = /v1/completions      { if ($smh_key_ok = 0) { return 401; } proxy_pass http://127.0.0.1:8000/v1/completions; }
        location = /v1/models           { if ($smh_key_ok = 0) { return 401; } proxy_pass http://127.0.0.1:8000/v1/models; }
        location = /health              { proxy_pass http://127.0.0.1:8000/health; }
        location / { return 404; }
    }
}
